<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Admin — Servers</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container">
        <h1 class="page-title">Servers</h1>
        <p class="page-subtitle">Manage server availability and status</p>

        <div class="alert alert-success" th:if="${successMsg}" th:text="${successMsg}"></div>
        <div class="alert alert-error"   th:if="${errorMsg}"   th:text="${errorMsg}"></div>

        <table>
            <thead>
                <tr>
                    <th>Server ID</th>
                    <th>Name</th>
                    <th>IP Address</th>
                    <th>Status</th>
                    <th>Update Status</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="srv : ${servers}">
                    <td th:text="${srv.server_id}"></td>
                    <td th:text="${srv.name}"></td>
                    <td th:text="${srv.ip_address}"></td>
                    <td>
                        <span class="badge badge-confirmed" th:if="${srv.status == 'online'}">Online</span>
                        <span class="badge badge-cancelled" th:if="${srv.status == 'offline'}">Offline</span>
                        <span class="badge badge-pending"   th:if="${srv.status == 'maintenance'}">Maintenance</span>
                    </td>
                    <td>
                        <form th:action="@{/admin/servers/{id}/status(id=${srv.server_id})}" method="post" style="display:flex; gap:0.5rem; align-items:center;">
                            <select name="status">
                                <option value="online"      th:selected="${srv.status == 'online'}">Online</option>
                                <option value="offline"     th:selected="${srv.status == 'offline'}">Offline</option>
                                <option value="maintenance" th:selected="${srv.status == 'maintenance'}">Maintenance</option>
                            </select>
                            <button type="submit" class="btn btn-primary" style="font-size:0.8rem; padding:0.3rem 0.8rem;">Update</button>
                        </form>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(servers)}">
                    <td colspan="5" style="text-align:center; color:var(--muted); padding:2rem;">No servers registered.</td>
                </tr>
            </tbody>
        </table>

        <a th:href="@{/admin/dashboard}" style="display:inline-block; margin-top:1.5rem;">
            <button class="btn btn-primary">← Back to Dashboard</button>
        </a>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
