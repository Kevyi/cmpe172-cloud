<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Admin — Appointments</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container">
        <h1 class="page-title">All Appointments</h1>
        <p class="page-subtitle">Review and approve or deny pending bookings</p>

        <div class="alert alert-success" th:if="${successMsg}" th:text="${successMsg}"></div>
        <div class="alert alert-error"   th:if="${errorMsg}"   th:text="${errorMsg}"></div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Email</th>
                    <th>Server</th>
                    <th>Service</th>
                    <th>Status</th>
                    <th>Start</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="apt : ${appointments}">
                    <td th:text="${apt.app_id}"></td>
                    <td th:text="${apt.email}"></td>
                    <td th:text="${apt.server_id}"></td>
                    <td th:text="${apt.service_id}"></td>
                    <td>
                        <span class="badge badge-confirmed" th:if="${apt.status == 'CONFIRMED'}">Confirmed</span>
                        <span class="badge badge-cancelled" th:if="${apt.status == 'CANCELLED'}">Cancelled</span>
                        <span class="badge badge-confirmed" th:if="${apt.status == 'RUNNING'}"  style="background:#22c55e;">Running</span>
                        <span class="badge badge-pending"   th:if="${apt.status == 'COMPLETED'}" style="background:#6366f1;">Completed</span>
                        <span class="badge badge-pending"   th:if="${apt.status == 'PENDING'}">Pending</span>
                    </td>
                    <td th:text="${apt.start_time}"></td>
                    <td>
                        <form th:if="${apt.status == 'PENDING'}"
                              th:action="@{/admin/appointments/{id}/approve(id=${apt.app_id})}"
                              method="post" style="display:inline;">
                            <button type="submit" class="btn btn-primary" style="font-size:0.8rem; padding:0.3rem 0.8rem;">Approve</button>
                        </form>
                        <form th:if="${apt.status == 'PENDING'}"
                              th:action="@{/admin/appointments/{id}/deny(id=${apt.app_id})}"
                              method="post" style="display:inline; margin-left:0.4rem;">
                            <button type="submit" class="btn btn-danger" style="font-size:0.8rem; padding:0.3rem 0.8rem;">Deny</button>
                        </form>
                        <span th:unless="${apt.status == 'PENDING'}" style="color:var(--muted); font-size:0.85rem;">—</span>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(appointments)}">
                    <td colspan="7" style="text-align:center; color:var(--muted); padding:2rem;">No appointments found.</td>
                </tr>
            </tbody>
        </table>

        <a th:href="@{/admin/dashboard}" style="display:inline-block; margin-top:1.5rem;">
            <button class="btn btn-primary">← Back to Dashboard</button>
        </a>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
