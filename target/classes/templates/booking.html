<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Book Appointment</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container">
        <h1 class="page-title">Book Appointment</h1>
        <p class="page-subtitle">Confirm your hosting slot</p>

        <div class="alert alert-error" th:if="${errorMsg}" th:text="${errorMsg}"></div>

        <div class="form-card">
            <form th:action="@{/appointments}" method="post">

                <!-- Hidden slot fields pre-populated from slots page -->
                <input type="hidden" name="serverId"  th:value="${preselectedServerId}"/>
                <input type="hidden" name="startTime" th:value="${preselectedStartTime}"/>
                <input type="hidden" name="endTime"   th:value="${preselectedEndTime}"/>

                <div class="form-grid">

                    <div class="form-group">
                        <label>Server</label>
                        <input type="text" th:value="${preselectedServerId}" readonly
                               style="opacity:0.6; cursor:not-allowed;"/>
                    </div>

                    <div class="form-group">
                        <label>Start Time</label>
                        <input type="text" th:value="${preselectedStartTime}" readonly
                               style="opacity:0.6; cursor:not-allowed;"/>
                    </div>

                    <div class="form-group">
                        <label>End Time</label>
                        <input type="text" th:value="${preselectedEndTime}" readonly
                               style="opacity:0.6; cursor:not-allowed;"/>
                    </div>

                    <div class="form-group">
                        <label>Service to Host</label>
                        <select name="serviceId" id="serviceSelect" required onchange="toggleCustomService(this.value)">
                            <option value="">— Select a service —</option>
                            <option th:each="svc : ${services}"
                                    th:value="${svc.service_id}"
                                    th:text="${svc.name}">
                            </option>
                            <option value="custom">— Custom Service —</option>
                        </select>
                    </div>

                </div>

                <!-- Custom service fields, shown only when "Custom Service" is selected -->
                <div id="customServiceFields" style="display:none; margin-top:1rem;">
                    <hr style="margin-bottom:1rem;"/>
                    <p style="font-weight:600; margin-bottom:0.75rem;">Custom Container Details</p>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Service Name <span style="color:var(--danger)">*</span></label>
                            <input type="text" id="customName" name="customName"
                                   placeholder="e.g. My Flask App"/>
                        </div>
                        <div class="form-group">
                            <label>Docker Image <span style="color:var(--danger)">*</span></label>
                            <input type="text" id="customDockerImage" name="customDockerImage"
                                   placeholder="e.g. myrepo/myapp:latest"/>
                        </div>
                        <div class="form-group" style="grid-column: 1 / -1;">
                            <label>Description</label>
                            <input type="text" name="customDescription"
                                   placeholder="Brief description of the service (optional)"/>
                        </div>
                    </div>
                </div>

                <p style="color:var(--muted); font-size:0.85rem; margin-bottom:1.5rem;">
                    Booking as: <strong th:text="${sessionUser}"></strong>
                </p>

                <div style="display:flex; gap:1rem;">
                    <button type="submit" class="btn btn-primary">Confirm Booking</button>
                    <a th:href="@{/slots}">
                        <button type="button" class="btn btn-danger">← Back to Slots</button>
                    </a>
                </div>
            </form>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>

<script>
function toggleCustomService(val) {
    var panel = document.getElementById('customServiceFields');
    var nameInput  = document.getElementById('customName');
    var imageInput = document.getElementById('customDockerImage');
    var isCustom = val === 'custom';
    panel.style.display = isCustom ? 'block' : 'none';
    nameInput.required  = isCustom;
    imageInput.required = isCustom;
}
</script>

</body>
</html>
