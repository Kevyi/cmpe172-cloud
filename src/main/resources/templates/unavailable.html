<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Slot Unavailable</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <style>
        .error-icon {
            width: 80px; height: 80px;
            background: #ef4444;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 1.5rem;
            font-size: 2.5rem;
        }
        .info-box {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 1rem 1.5rem;
            max-width: 560px;
            margin: 0 auto 2rem;
            text-align: center;
            color: var(--muted);
            font-size: 0.875rem;
        }
        .action-row {
            display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;
        }
    </style>
</head>
<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container" style="text-align:center; padding-top: 3rem;">

        <div class="error-icon">✕</div>

        <h1 class="page-title" style="margin-bottom:0.5rem;">Slot No Longer Available</h1>
        <p class="page-subtitle" style="margin-bottom:2.5rem;">
            Someone else booked this slot just before you. Please choose a different time.
        </p>

        <div class="info-box">
            This can happen when multiple users request the same slot at the same time.
            Head back to <a th:href="@{/slots}" style="color:var(--accent);">Browse Slots</a>
            to find another available time.
        </div>

        <div class="action-row">
            <a th:href="@{/slots}">
                <button class="btn btn-primary">Browse Available Slots</button>
            </a>
            <a th:href="@{/}">
                <button class="btn btn-primary" style="background:transparent; border:1px solid var(--accent); color:var(--accent);">
                    Go Home
                </button>
            </a>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
