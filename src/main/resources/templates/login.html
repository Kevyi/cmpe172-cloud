<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container">
        <h1 class="page-title">Sign In</h1>
        <p class="page-subtitle">Access your cloud scheduling account</p>

        <div class="alert alert-error"   th:if="${errorMsg}"   th:text="${errorMsg}"></div>
        <div class="alert alert-success" th:if="${successMsg}" th:text="${successMsg}"></div>

        <div class="form-card">
            <form action="/login" method="post">
                <div class="form-grid">

                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" name="email" placeholder="you@example.com" required/>
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" name="password" placeholder="••••••••" required/>
                    </div>

                    <div class="form-group">
                        <label>Role</label>
                        <div style="display:flex; gap:1.5rem; margin-top:0.5rem;">
                            <label style="display:flex; align-items:center; gap:0.4rem; cursor:pointer;">
                                <input type="radio" name="role" value="user" checked/> User
                            </label>
                            <label style="display:flex; align-items:center; gap:0.4rem; cursor:pointer;">
                                <input type="radio" name="role" value="admin"/> Admin
                            </label>
                        </div>
                    </div>

                </div>

                <button type="submit" class="btn btn-primary">Sign In</button>
            </form>

            <p style="margin-top:1.5rem; color:var(--muted); font-size:0.9rem;">
                No account? <a th:href="@{/register}" style="color:var(--accent);">Register here</a>
            </p>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
