<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Register</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container">
        <h1 class="page-title">Create Account</h1>
        <p class="page-subtitle">Register to book cloud hosting slots</p>

        <div class="alert alert-error"   th:if="${errorMsg}"   th:text="${errorMsg}"></div>
        <div class="alert alert-success" th:if="${successMsg}" th:text="${successMsg}"></div>

        <div class="form-card">
            <form th:action="@{/register}" th:object="${user}" method="post">
                <div class="form-grid">

                    <div class="form-group">
                        <label>Name</label>
                        <input type="text" th:field="*{name}" placeholder="Your name" required/>
                    </div>

                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" th:field="*{email}" placeholder="you@example.com" required/>
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" th:field="*{password}" placeholder="••••••••" required/>
                    </div>

                </div>

                <button type="submit" class="btn btn-primary">Create Account</button>
            </form>

            <p style="margin-top:1.5rem; color:var(--muted); font-size:0.9rem;">
                Already have an account? <a th:href="@{/login}" style="color:var(--accent);">Sign in</a>
            </p>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
