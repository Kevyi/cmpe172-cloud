<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Appointments</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container">
        <h1 class="page-title">Appointments</h1>
        <p class="page-subtitle">Manage your cloud hosting bookings</p>

        <div class="alert alert-success" th:if="${successMsg}" th:text="${successMsg}"></div>
        <div class="alert alert-error"   th:if="${errorMsg}"   th:text="${errorMsg}"></div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Email</th>
                    <th>Service</th>
                    <th>Status</th>
                    <th>Start</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="apt : ${appointments}">
                    <td th:text="${apt.app_id}"></td>
                    <td th:text="${apt.email}"></td>
                    <td th:text="${apt.service_id}"></td>
                    <td>
                        <span class="badge badge-confirmed" th:if="${apt.status == 'CONFIRMED'}">Confirmed</span>
                        <span class="badge badge-confirmed" th:if="${apt.status == 'RUNNING'}"  style="background:#22c55e;">Running</span>
                        <span class="badge badge-pending"   th:if="${apt.status == 'COMPLETED'}" style="background:#6366f1;">Completed</span>
                        <span class="badge badge-cancelled" th:if="${apt.status == 'CANCELLED'}">Cancelled</span>
                        <span class="badge badge-pending"   th:if="${apt.status == 'PENDING'}">Pending</span>
                    </td>
                    <td th:text="${apt.start_time}"></td>
                    <td>
                        <button class="btn btn-danger"
                                th:if="${apt.status != 'CANCELLED'}"
                                th:attr="data-appid=${apt.app_id}"
                                onclick="cancelAppointment(this.getAttribute('data-appid'))"
                                style="font-size:0.8rem; padding:0.3rem 0.8rem;">
                            Cancel
                        </button>
                        <a th:if="${apt.status != 'CANCELLED'}"
                           th:href="@{/appointments/{id}/reschedule(id=${apt.app_id})}"
                           style="margin-left:0.4rem;">
                            <button class="btn btn-primary" style="font-size:0.8rem; padding:0.3rem 0.8rem;">
                                Reschedule
                            </button>
                        </a>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(appointments)}">
                    <td colspan="6" style="text-align:center; color:var(--muted); padding:2rem;">
                        No appointments found.
                    </td>
                </tr>
            </tbody>
        </table>

        <a th:href="@{/slots}" style="display:inline-block; margin-top:1.5rem;">
            <button class="btn btn-primary">+ New Booking</button>
        </a>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script>
        function cancelAppointment(appId) {
            fetch(`/appointments/${appId}/cancel`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            }).then(res => {
                if (res.ok) window.location.reload();
                else alert('Failed to cancel appointment');
            });
        }
    </script>

</body>
</html>
